# Time domain electromagnetic system.
#
# Replace every '?? ... ??' with a value, or with not_defined where it is unknown.
# A field can hold its value beside its key, or nest it under values: alongside
# its own attributes (units, long_name, ...). One value given for a transmitter,
# receiver or couplet field is repeated for every one of them; a list gives one
# value each, in label order.

# Shaped by System.metadata_template('tdem', transmitters=..., receivers=...).
# Every receiver measures every transmitter, so N transmitters and M receivers
# give N x M couplets, and each transmitter gets its own set of gate times.
pairing: cross

attrs:
  type: system
  mode: '?? airborne, ground, waterborne or borehole ??'  # the platform the system is operated from
  method: electromagnetic, time domain  # leave as is; the method family
  instrument: '?? make and model, e.g. SkyTEM 304M ??'  # as the contractor names it

# The axes the system's arrays lie along. Each needs centers (or bounds), or a length.
dimensions:
  # The times after turn off at which the {label} transient is sampled, one entry
  # per gate. Give centers, and bounds too if the gate widths are known.
  gate_times:
    per: transmitter
    long_name: '?? e.g. calibrated {label} gate times ??'
    units: seconds
    missing_value: not_defined
    centers: '?? one centre time per {label} gate, seconds ??'
    bounds: '?? a row of {label} gate open times then a row of close times, 2 by number of gates ??'
  # Corners of the transmitter loop; coordinates holds an xyz triple for each.
  n_loop_vertices:
    standard_name: number_of_loop_vertices
    long_name: number of transmitter loop vertices
    units: not_defined
    missing_value: not_defined
    length: '?? how many corners the transmitter loop has ??'
  xyz:  # the three components of a loop vertex; leave as is
    standard_name: xyz_coordinates
    long_name: coordinates of the loop vertices
    units: not_defined
    missing_value: not_defined
    length: 3

variables:

  # One value each, describing the whole system.
  scalars:
    data_normalized: '?? True or False, is the data normalised by transmitter moment ??'  # True if divided by the moment
    reference_frame: '?? e.g. right-handed positive down ??'  # the sign convention of the delivered components
    output_data_type: '?? what the data file holds, e.g. dBdt or B ??'  # the quantity delivered: dB/dt or B field
    output_sample_frequency: '?? Hz, of the delivered data ??'  # soundings per second after stacking and resampling
    sample_rate: '?? seconds per sounding ??'  # the reciprocal of output_sample_frequency
    digitization_frequency: '?? Hz ??'  # the rate the receiver digitises the raw signal at
    stacks: '?? how many transients were stacked ??'  # per delivered sounding
    powerline_frequency: '?? Hz, 50 or 60 ??'  # the mains frequency rejected by the receiver

  # One entry per transmitter, in the order of its labels.
  transmitter:
    number_of_turns: '?? turns of wire in the loop ??'  # per transmitter; a moment may use fewer turns than another
    area: '?? loop area, m^2 ??'  # the area enclosed by the loop, not the wire length
    # The loop corners relative to the system's reference point, metres. Its
    # dimensions give the shape, so write out every vertex of every transmitter.
    coordinates:
      values: '?? loop vertex coordinates, an xyz triple per vertex per transmitter ??'
      dimensions: [n_transmitter, n_loop_vertices, xyz]
    orientation: '?? dipole orientation, e.g. z ??'  # the axis of the transmitter dipole
    waveform_type: '?? e.g. trapezoid or square ??'  # the shape of the current pulse
    # The current waveform, as vertices joined by straight lines. waveform_time is a
    # dimension, one time per vertex, and waveform_current gives each transmitter's
    # normalised current at those times.
    waveform_time:
      values: '?? time of each waveform vertex, seconds ??'
      long_name: waveform time
      units: s
      missing_value: not_defined
    waveform_current:  # a row per transmitter, one value per waveform time, peak of 1
      values: '?? normalised current at each waveform time ??'
      dimensions: [n_transmitter, waveform_time]
    current_scale_factor: '?? multiplier taking the normalised waveform to amps ??'  # usually the peak current
    peak_current: '?? amps ??'  # the largest current in the loop
    moment: '?? A m^2 ??'  # turns x area x current
    peak_moment: '?? A m^2 at peak current ??'  # turns x area x peak current
    base_frequency: '?? Hz ??'  # repetition rate of the waveform, one full on-off cycle
    on_time: '?? seconds ??'  # how long the current is on in each half cycle
    off_time: '?? seconds ??'  # how long the current is off in each half cycle, where the gates sit
    height: '?? metres above ground ??'  # nominal; the measured height goes in the data

  # One entry per receiver coil, in the order of its labels.
  receiver:
    orientation: '?? coil orientation, e.g. z ??'  # the component this coil measures: x, y or z
    area:  # the effective area of the receiver coil
      values: '?? effective coil area, m^2 ??'
      units: m^2
    coil_low_pass_filter: '?? Hz ??'  # cut off of the coil's own response
    instrument_low_pass_filter: '?? Hz ??'  # cut off of the receiver electronics
    delay_time: '?? seconds between transmitter off and the first gate ??'  # or not_defined if the gates already include it
    gain: '?? amplifier gain ??'  # dimensionless
    height: '?? metres above ground ??'  # nominal; the measured height goes in the data

  # One entry per transmitter and receiver pair. transmitters, receivers and
  # gate_times are filled in from the labels; everything else is per couplet.
  couplet:
    txrx_dx: '?? metres from transmitter to receiver, along the line ??'  # positive in the flight direction
    txrx_dy: '?? metres from transmitter to receiver, across the line ??'  # sign by reference_frame
    txrx_dz: '?? metres from transmitter to receiver, vertical ??'  # sign by reference_frame
    data_type: '?? e.g. dBdt or B ??'  # the quantity this couplet's data column holds
    sample_rate: '?? seconds per sounding ??'  # for this couplet, where moments are sampled differently
    gate_times: '?? which gate times this couplet is measured on ??'  # filled in; the dimension of its transmitter
