magnetic_system:
    type: system
    mode: airborne
    method: magnetic
    instrument: Geometrics G-822A cesium‑vapor magnetometer

    prefixes: ['base_magnetometer']

    dimensions:
        base_mag_locations:
            standard_name: base_mag_locations
            long_name: Base Magnetometer Location Index Numbers
            units: not_defined
            missing_value: not_defined
            centers: [1, 2]
            discrete: True

    variables:

        transmitter:
            label: passive
            description: No artificial magnetic transmitter was used. The system measures the scalar Larmor precession frequency induced by the Earth's magnetic field.

        receiver:
            label: scalar_magnetometer
            sensor_type: cesium-vapor split-beam
            sensor_model: G-822A
            sensor_manufacturer: Geometrics
            description: Scalar cesium-vapor magnetometer mounted in the aircraft tail stinger. Measures total magnetic field through Larmor precession frequency.
            orientation: Tail-stinger mounted; scalar measurement independent of orientation.
            coordinates: not_reported
            lag_correction: Lag was negligible and no lag correction was applied
            heading_correction: Heading was negligible and no heading correction was applied

        couplet:
            transmitters: [passive]
            receivers: [scalar_magnetometer]
            description: The magnetic measurement system consists of the Earth's field as a passive transmitter and a single scalar magnetometer mounted in the tail stinger.

        base_magnetometer:
            label: base_magnetometer
            description: The base station magnetometer was placed in a location of low magnetic gradient, away from electrical transmission lines and moving metallic objects, such as motor vehicles and aircrafts.

            location_names:
                values: ["Door County", "Manitowoc"]
                dimensions: 'base_mag_locations'

            values:
                values: [54538, 54194.7]
                units: nT
                dimensions: 'base_mag_locations'

            latitude:
                values: [44.849335, 44.127998]
                long_name: Latitude in WGS84
                units: decimal degrees
                dimensions: 'base_mag_locations'

            longitude:
                values: [87.422440, 87.685524]
                long_name: Longitude in WGS84
                units: decimal degrees
                dimensions: 'base_mag_locations'

            elevation:
                values: [178.1, 164.4]
                long_name: Elevation
                datum: WGS84
                units: m
                dimensions: 'base_mag_locations'

        diurnal_correction: Diurnal signal removed using 3 second Fraser low-pass filter and subtracting base-station magnetometer values.
        tieline_levelling: No tie line-leveling were applied
        microlevelling: No micro-levelling were applied
        igrf_model_date: "2015, 15th generation"
        igrf_model_location: variable according to GPS WGS84 longitude and latitude
        igrf_model_height: variable according to magnetic sensor altitude derived from DGPS data