        long_name: Standard depth of investigation
        missing_value: not_defined
        units: m
    ELEVATION:
        standard_name: elevation
        long_name: Modified digital elevation model that incorporates water surface elevation with CONED land elevation
        description : A modified digital elevation model was developed using the Coastal National Elevation Dataset (CoNED) as a the primary land-surface reference.  Within 1-km of the bay shore, the contractor-developed digital elevation model was substituted where above the CoNED surface to account for the water surface elevation over the bay and tidal areas at the time of data collection.
