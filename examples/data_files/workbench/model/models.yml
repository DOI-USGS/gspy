        dimensions: ['index', 'layer_depth']
    RHO_STD:
        standard_name: rho_std
        long_name: Standard deviation factor for inverted resistivitity
        missing_value: not_defined
        units: ohm meter
        dimensions: ['index', 'layer_depth']
    SEGMENTS:
        standard_name: segments
        long_name: Data segments used for inversion
        missing_value: not_defined
        units: not_defined
    SIGMA:
        standard_name: sigma
        long_name: Electrical conductivity (1 / resistivity)
