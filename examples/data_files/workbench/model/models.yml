dataset_attrs:
    content: inverted resistivity models with input data and synthetic responses
    comment: This dataset includes AEM inverted models produced by USGS using Aarhus Workbench. Included with models are data input into the inversion and synthetic forward responses.
    type: model, data
    structure: tabular
    mode: airborne
    method: electromagnetic, time domain
    instrument: skyTEM 304M
    property: electrical resistivity

inversion_parameters:
    dataset_attrs:
        type: parameters
        method: electromagnetic, time domain
        instrument: skyTEM 304M
        mode: airborne
        property: electrical resistivity

    variables:
        model_file: prod_726_729_LBv2_bky_MOD_inv.xyz
        inversion_software: Workbench, Aarhus Geosoftware, Aarhus, Denmark
        software_version: Aarhus Workbench version 6 2024.2
        date: 2024
        number_of_layers: 40
        constraints: laterally constrained
        description: Deterministic inversion of the processed AEM data was implemented in Aarhus Workbench software. Inversion parameters were selected by running a series of test models with varying starting model resistivity values, layer discretization, vertical/lateral constraints, and other inversion parameters. Laterally constrained blocky inversion models were developed using a 40-layer domain with layer top depths ranging between 1 and 300 meters and layer thickness increasing with depth. Inversions were run with vertical and lateral constraints of values of 4.0 and 2.0, respectively, and a spatially varying, data-dependent homogenous half-space starting model.  Sensor altitude was treated as a free parameter after the 8th iteration. Depth of investigation was constrained to depths between 5 and 400 meters.
        data_file: prod_726_729raw_RAW_export.xyz

coordinates:
    x: UTMX
    y: UTMY
    z: ELEVATION

