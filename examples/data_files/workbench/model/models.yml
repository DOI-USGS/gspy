variables:
    ALTITUDE_:
        standard_name: altitude
        long_name: Inverted transmitter altitude
        missing_value: not_defined
        units: m
    ALTITUDE_A-PRIORI_:
        standard_name: altitude_a_priori
        long_name: A priori altitude used for inversion
        missing_value: not_defined
        units: m
    ALTITUDE_A-PRIORI_STD_:
