        missing_value: not_defined
        units: yyyy/mm/dd
    DEP_BOT:
        standard_name: depth_bottom
        long_name: Depth to bottom of model layer
        missing_value: not_defined
        units: m
        dimensions: ['index', 'layer_depth']
    DEP_BOT_STD:
