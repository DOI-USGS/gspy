
dataset_attrs:
    content: raw data
    comment: Contains flightline magnetic data
    type: data
    structure: tabular
    mode: airborne
    method: magnetic, total magnetic field
    instrument: cesium vapour

magnetic_system:
    type: system
    mode: airborne
    method: magnetic
    instrument: Geometrics G-822A cesium‑vapor magnetometer 

    prefixes: ['base_magnetometer']

    dimensions:
        base_mag_locations:
            standard_name: base_mag_locations
            long_name: Base Magnetometer Location Index Numbers
            units: not_defined
            null_value: not_defined
            centers: [1, 2]
            discrete: True

    variables: 

        transmitter:
            label: passive
            description: No artificial magnetic transmitter was used. The system measures the scalar Larmor precession frequency induced by the Earth's magnetic field.

        receiver:
            label: scalar_magnetometer
            sensor_type: cesium-vapor split-beam
            sensor_model: G-822A
            sensor_manufacturer: Geometrics
            description: Scalar cesium-vapor magnetometer mounted in the aircraft tail stinger. Measures total magnetic field through Larmor precession frequency.
            orientation: Tail-stinger mounted; scalar measurement independent of orientation.
            coordinates: not_reported   
            lag_correction: Lag was negligible and no lag correction was applied
            heading_correction: Heading was negligible and no heading correction was applied

        couplet:
            passive_scalar_pair:
            transmitters: [passive]
            receivers: [scalar_magnetometer]
            description: The magnetic measurement system consists of the Earth's field as a passive transmitter and a single scalar magnetometer mounted in the tail stinger.

        base_magnetometer: 
            label: base_magnetometer
            description: The base station magnetometer was placed in a location of low magnetic gradient, away from electrical transmission lines and moving metallic objects, such as motor vehicles and aircrafts. 

            location_names:
                values: ["Door County", "Manitowoc"]
                dimensions: 'base_mag_locations'

            values:
                values: [54538, 54194.7]
                units: nT
                dimensions: 'base_mag_locations'

            latitude:
                values: [44.849335, 44.127998]
                long_name: Latitude in WGS84
                units: decial degrees
                dimensions: 'base_mag_locations'

            longitude:
                values: [87.422440, 87.685524]
                long_name: Longitude in WGS84
                units: decial degrees
                dimensions: 'base_mag_locations'
            
            elevation:
                values: [178.1, 164.4]
                long_name: Elevation
                datum: WGS84
                units: m
                dimensions: 'base_mag_locations'

        diurnal_correction: Diurnal signal removed using 3 second Fraser low-pass filter and subtracting base-station magnetometer values.
        tieline_levelling: No tie line-leveling were applied
        microlevelling: No micro-levelling were applied 
        igrf_model_date: "2015, 15th generation" 
        igrf_model_location: variable according to GPS WGS84 longitude and latitude
        igrf_model_height: variable according to magnetic sensor altitude derived from DGPS data    

coordinates:
    x: E_Nad83
    y: N_Nad83
    z: DEM

variables:
    E_Nad83:
        standard_name: easting_nad83
        long_name: Easting, Wisconsin Transverse Mercator (WTM), North American Datum of 1983 (NAD83)
        units: meter
        null_value: not_defined
        axis: x

    N_Nad83:
        standard_name: northing_nad83
        long_name: Northing, Wisconsin Transverse Mercator (WTM), North American Datum of 1983 (NAD83)
        units: meter
        null_value: not_defined
        axis: y

    Alt:
        standard_name: altitude
        long_name: DGPS instrument altitude
        units: meter
        null_value: not_defined

    Base_Mag:
        standard_name: base_magnetometer
        long_name: Raw magnetic base station data
        units: nanoTesla
        null_value: -9999.99

    Date:
        standard_name: date
        long_name: Date, yyyy/mm/dd
        units: not_defined
        null_value: not_defined

    dec:
        standard_name: decliniation
        long_name: IGRF declination
        units: degree
        null_value: not_defined

    DEM:
        standard_name: dem
        long_name: Digital elevation model
        units: meter
        null_value: not_defined
        axis: Z
        positive: up
        datum: North American Vertical Datum of 1988 (NAVD88)

    Diurnal:
        standard_name: magnetic_diurnal
        long_name: Magnetic base station diurnal variation
        units: nanoTesla
        null_value: not_defined

    Fid:
        standard_name: fiducial
        long_name: Unique fiducial number
        units: not_defined
        null_value: not_defined

    Height:
        standard_name: instrument_height
        long_name: Instrument height above ground
        units: meter
        null_value: not_defined

    igrf:
        standard_name: magnetic_igrf_model
        long_name: Magnetic IGRF value from 2015 model
        units: nanoTesla
        null_value: not_defined

    inc:
        standard_name: inclination
        long_name: IGRF inclination
        units: degree
        null_value: not_defined

    Lat:
        standard_name: latitude
        long_name: Latitude, World Geodetic System of 1984 (WGS84)
        units: degree
        null_value: not_defined

    Line:
        standard_name: line
        long_name: Line number
        units: not_defined
        null_value: not_defined

    Lon:
        standard_name: longitude
        long_name: Longitude, World Geodetic System of 1984 (WGS84)
        units: degree
        null_value: not_defined

    Mag_Filt:
        standard_name: total_magnetic_intensity_filtered
        long_name: Filtered total magnetic intensity data
        units: nanoTesla
        null_value: not_defined

    Mag_Raw:
        standard_name: total_magnetic_intensity_raw
        long_name: Raw total magnetic intensity data
        units: nanoTesla
        null_value: not_defined

    RMF:
        standard_name: residual_magnetic_field
        long_name: Residual magnetic field, IGRF corrected based on 2015 model
        units: nanoTesla
        null_value: not_defined

    Time:
        standard_name: time_utc
        long_name: Universal coordinated time (UTC), hh:mm:ss
        units: not_defined
        null_value: not_defined

    TMI:
        standard_name: total_magnetic_intensity
        long_name: Diurnally corrected filtered total magnetic intensity
        units: nanoTesla
        null_value: not_defined