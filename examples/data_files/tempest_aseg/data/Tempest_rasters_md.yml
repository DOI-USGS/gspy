dataset_attrs:
    comment: resistivity models are USGS-derived, the total magnetic intensity map is contractor-derived
    content: interpolated resistivity models (3-D depth grid) and total magnetic intensity map (2-D)
    type: data, models
    method: ["electromagnetic, time domain","magnetic"]
    instrument: 30Hz Tempest
    mode: airborne
    property: electrical resistivity, total magnetic intensity

coordinates:
    x: Easting_Albers
    y: Northing_Albers
    z: depth

dimensions:
    x: Easting_Albers
    y: Northing_Albers
    
    depth:
        comment: depth is defined here inside our yaml file in order to stack the resistivity tifs along a third dimension. This depth information is not contained in any of the individual tifs.
        standard_name: depth
        long_name: Depth below earth's surface DTM
        units: m
        missing_value: not_defined
        length: 5
        increment: 5.0
        origin: 0.0
        positive: down
        datum: ground surface

variables:
    Easting_Albers:
        standard_name: easting_albers
        long_name: Easting
        units: meter
        missing_value: not_defined

    Northing_Albers:
        standard_name: northing_albers
        long_name: Northing
        units: meter
        missing_value: not_defined

    resistivity:
        dimensions: [x, y, z]
        standard_name: log10_resistivity
        long_name: Electrical Resistivity on Logarithmic Scale
        units: log10_ohm_m
        missing_value: -9999.99
        files: [resistivity_0_5m.tif,
                resistivity_5_10m.tif,
                resistivity_10_15m.tif,
                resistivity_15_20m.tif,
                resistivity_20_25m.tif]

    magnetic_tmi:
        dimensions: [x, y]
        standard_name: total_magnetic_intensity
        long_name: Total magnetic intensity, diurnally corrected and filtered
        units: nT
        missing_value: -999999
        files: [mag_aligned.tif]