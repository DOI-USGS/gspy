        positive: up
        datum: NAD88

    conductivity:
        dimensions: [index, layer_depth]

    thickness:
        dimensions: [index, layer_depth]

    observed_EMSystem_1_XS:
        dimensions: [index, gate_times]

    observed_EMSystem_1_ZS:
        dimensions: [index, gate_times]

    noise_EMSystem_1_XS:
        dimensions: [index, gate_times]

    noise_EMSystem_1_ZS:
        dimensions: [index, gate_times]

    predicted_EMSystem_1_XS:
