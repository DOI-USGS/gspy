survey_equipment:
    aircraft: Eurocopter Astar 350 B3
    magnetometer: Geometrics G822A, Kroum KMAG4 counter
    magnetometer_installation: front of EM transmitter frame
    electromagnetic_system: SkyTEM304M time‑domain electromagnetic system
    electromagnetic_installation: Rigid transmitter frame 40 m beneath helicopter, Receiver coils at rear of transmitter frame 2 m vertical offset
    spectrometer_system: n/a
    radar_altimeter_system: n/a
    laser_altimeter_system: Two MDL ILM 300R laser altimeters
    laser_altimeter_installation: both laser altimeters were mounted on the suspended EM frame
    laser_altimeter_information: Sampling rate 30 Hz, range 0.2 to 200 m and uncertainty 10 to 30 cm.
    inclinometer_system: Two Bjerre Technology inclinometers
    inclinometer_installation: Both inclinometers were installed on the rear of the EM frame near the Z coil.
    inclinometer_information: Measured x and y tilt at 2 Hz sampling rate.  The x angle is parallel to flight direction (positive when front is above horizontal); y angle is perpendicular to flight direction (negative when right side is above horizontal).
    gsp_system: Differential GPS using OEMV1-L1 chipset and Trimble Bullet III antennas. Two DGPS units recorded by EM system; a third GPS recorded by the magnetic system.
    gps_installation:  DGPS antenna mounted on top of the boom in front of the frame
    gps_information: Sampling rate 1 Hz. The uncertainty in the xyz-directions is 1 m after processing. 
