        system_couplet: passive_scalar_magnetometer
    cpsp:
        standard_name: cpsp
        long_name: Co-planar spherics monitor
        units: n/a
        missing_value: not_defined
    cxsp:
        standard_name: cxsp
        long_name: Co-axial spherics monitor
