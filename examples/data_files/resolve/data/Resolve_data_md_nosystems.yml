        missing_value: not_defined
    bird_roll:
        standard_name: bird_roll
        long_name: EM bird transmitter (Tx) roll
        units: Degrees
        missing_value: not_defined
    bird_yaw:
        standard_name: bird_yaw
        long_name: EM bird transmitter (Tx) yaw (heading)
        units: Degrees
        missing_value: not_defined
    diurnal:
        standard_name: diurnal
        long_name: Measured base station ground magnetic intensity
        units: nanoteslas (nT)
        missing_value: -9999
    diurnal_cor:
        standard_name: diurnal_cor
        long_name: Diurnal correction, base removed
        units: nanoteslas (nT)
        missing_value: not_defined
    mag_raw:
        standard_name: mag_raw
        long_name: Total magnetic field, de-spiked
        units: nanoteslas (nT)
        missing_value: not_defined
        system_couplet: passive_scalar_magnetometer
    mag_L:
        standard_name: mag_l
        long_name: Total magnetic field, lagged
        units: nanoteslas (nT)
        missing_value: not_defined
        system_couplet: passive_scalar_magnetometer
    mag_LD:
        standard_name: mag_ld
        long_name: Total magnetic field, lagged and diurnally corrected
