dataset_attrs:
    content: raw data
    comment: This dataset includes minimally processed (raw) AEM data
    type: data
    mode: airborne
    method: electromagnetic, frequency domain
    instrument: RESOLVE

coordinates:
    x: x_WGS84_Albers
    y: y_WGS84_Albers
    z: DTM

dimensions:
    channel:
        centers: ['in-phase','quadrature']
        standard_name: frequency_domain_complex_data
        long_name: complex frequency domain data channel
        units: not_defined
        missing_value: not_defined
        discrete: True
    frequency:
        standard_name: frequency
        long_name: nominal measurement frequency
        units: Hz
        missing_value: not_defined
        centers: [400, 1800, 3300, 8200, 40000, 140000]
        discrete: True
    spec_sample:
        standard_name: spec_sample
        long_name: radiometric sample
        units: not_defined
        missing_value: not_defined
        length: 256
        increment: 1
        origin: 0
        discrete: True
    layer_depth:
        standard_name: layer_depth
        long_name: layer depth below surface
        units: meters
        missing_value: not_defined
        length: 31
        increment: 5.0
        origin: 2.5
        axis: Z
        positive: down
        datum: ground surface

variables:
    line:
        standard_name: line
        long_name: Line Number
        units: '#'
        missing_value: not_defined
    date:
        standard_name: date
        long_name: Date of the survey
        units: YYYYMMDD
        missing_value: not_defined
    utc_time:
        standard_name: utc_time
        long_name: Time, seconds after midnight UTC
        units: Seconds (s)
        missing_value: -9999
    flight:
        standard_name: flight
        long_name: Flight numer on which the data were collected
        units: '#'
        missing_value: not_defined
    fiducial:
        standard_name: fiducial
        long_name: Unique Fiducial Number
        units: n/a
        missing_value: not_defined
    temp_ext:
        standard_name: temp_ext
        long_name: External temperature
        units: Degrees Celsius (C)
        missing_value: not_defined
    kpa:
        standard_name: kpa
        long_name: External pressure
        units: kiloPascals (kPa)
        missing_value: not_defined
    x_WGS84_Albers:
        standard_name: x_wgs84_albers
        long_name: Easting in Albers Equal-Area Conic, World Geodetic Survey of 1984
            (WGS84) of EM Bird Transmitter (TX)
        units: Meters (m)
        missing_value: not_defined
    y_WGS84_Albers:
        standard_name: y_wgs84_albers
        long_name: Northing in Albers Equal-Area Conic, World Geodetic Survey of 1984
            (WGS84) of EM Bird Transmitter (TX)
        units: Meters (m)
        missing_value: not_defined
    x_WGS84_UTMZ15N:
        standard_name: x_wgs84_utmz15n
        long_name: Easting in Universal Transverse Mercator (UTM) Zone 15 North, World
            Geodetic Survey of 1984 (WGS84) of EM Bird Transmitter (TX)
        units: Meters (m)
        missing_value: not_defined
    y_WGS84_UTMZ15N:
        standard_name: y_wgs84_utmz15n
        long_name: Northing in Universal Transverse Mercator (UTM) Zone 15 North,
            World Geodetic Survey of 1984 (WGS84) of EM bird transmitter (Tx)
        units: Meters (m)
        missing_value: not_defined
    lat_tx:
        standard_name: lat_tx
        long_name: Latitude, WGS84, of EM bird transmitter (Tx)
        units: Decimal Degrees
        missing_value: not_defined
    lon_tx:
        standard_name: lon_tx
        long_name: Longitude, WGS84, of EM bird transmitter (Tx)
        units: Decimal Degrees
        missing_value: not_defined
    lat_heli:
        standard_name: lat_heli
        long_name: Latitude, WGS84, of helicopter
        units: Decimal Degrees
        missing_value: not_defined
    lon_heli:
        standard_name: lon_heli
        long_name: Longitude, WGS84, of helicopter
        units: Decimal Degrees
        missing_value: not_defined
    gpsz_tx:
        standard_name: gpsz_tx
        long_name: GPS elevation of EM bird transmitter (Tx), referenced to mean sea
            level - Earth Gravitational Model (EGM96)
        units: Meters (m)
        missing_value: not_defined
    gpsz_heli:
        standard_name: gpsz_heli
        long_name: GPS elevation of helicopter, referenced to mean sea level - Earth
            Gravitational Model (EGM96)
        units: Meters (m)
        missing_value: not_defined
    altlas_tx:
        standard_name: altlas_tx
        long_name: Laser altimeter height of the EM bird transmitter (Tx)
        units: Meters (m)
        missing_value: not_defined
    altrad_heli:
        standard_name: altrad_heli
        long_name: RADAR altimeter of helicopter
        units: Meters (m)
        missing_value: not_defined
    effective_height:
        standard_name: effective_height
        long_name: Height of helicopter at standard temperature and pressure
        units: Meters (m)
        missing_value: not_defined
    DTM:
        standard_name: dtm
        long_name: Digital terrain model (ground surface elevation, referenced to
            mean sea level - Earth Gravitational Model (EGM96))
        units: Meters (m)
        missing_value: not_defined
        positive: up
        datum: referenced to mean sea level - Earth Gravitational Model (EGM96)
    bird_pitch:
        standard_name: bird_pitch
        long_name: EM bird transmitter (Tx) pitch
