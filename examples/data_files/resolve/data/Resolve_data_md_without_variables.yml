dataset_attrs:
    content: raw data
    comment: This dataset includes minimally processed (raw) AEM data
    type: data
    mode: airborne
    method: electromagnetic, frequency domain
    instrument: RESOLVE

coordinates:
    x: x_WGS84_Albers
    y: y_WGS84_Albers
    z: DTM

resolve_system:
    type: system
    mode: airborne
    method: electromagnetic, frequency domain
    instrument: RESOLVE

    dimensions:
        channel:
            centers: ['in-phase','quadrature']
            standard_name: frequency_domain_complex_data
            long_name: complex frequency domain data channel
            units: not_defined
            missing_value: not_defined
            discrete: True
        frequency:
            standard_name: frequency
            long_name: nominal measurement frequency
            units: Hz
            missing_value: not_defined
            centers: [400, 1800, 3300, 8200, 40000, 140000]
            discrete: True

    variables:
        data_normalized: True
        output_data_type: ppm
        reference_frame: right-handed positive up
        output_sample_frequency: 10

        transmitter:
            label: [400Z, 1800Z, 3300X, 8200Z, 40000Z, 140000Z]
            orientation: [z, z, x, z, z, z]
            
        receiver:
            label: [400Z, 1800Z, 3300X, 8200Z, 40000Z, 140000Z]
            orientation: [z, z, x, z, z, z]

        couplet:
            transmitters: [400Z, 1800Z, 3300X, 8200Z, 40000Z, 140000Z]
            receivers: [400Z, 1800Z, 3300X, 8200Z, 40000Z, 140000Z]
            txrx_dx: [7.93, 7.95, 9.06, 7.93, 7.92, 7.97]
            txrx_dy: [0, 0, 0, 0, 0, 0]
            txrx_dz: [0, 0, 0, 0, 0, 0]
            orientation: [coplanar, coplanar, coaxial, coplanar, coplanar, coplanar]
            actual_frequency: [381, 1829, 3385, 8261, 40430, 133400]
            moment: [359, 187, 150, 72, 49, 17]

magnetic_system:
    type: system
    mode: airborne
    method: magnetic
    instrument: Scintrex CS-3 cesium-vapor magnetometer

    prefixes: ['base_magnetometer']

    variables:

        transmitter:
            label: passive
            description: "No artificial transmitter was used; the magnetic system measures the Earth's natural field (passive field)."

        receiver:
            label: scalar_magnetometer
            sensor_type: cesium_vapor
            sensor_model: CS-3  
            sensor_manufacturer: Scintrex
            description:  Scalar cesium-vapor magnetometer mounted in the RESOLVE EM bird towed beneath an AS350 B2 helicopter. Digital acquisition via CGG HeliDAS; positioning with NovAtel OEM4 GPS on helicopter and bird.  
            coordinates: not_defined 
            orientation: em-bird mounted 
            acquisition_system: CGG HeliDAS survey computer; NovAtel OEM4 GPS (WAAS-enabled) for navigation and synchronization; EM bird GPS OEM4 for positional data. 
            sample_frequency:
                values: 10.0
                units: Hz  
            sensitivity:
                values: 0.001
                units: nT   
            accuracy:
                values: 0.002
                units: nT   
            typical_noise:
                values: 1.0
                units: nT   
            sensor_height:
                values: 42
                units: m    
            lag_factor:
                values: 1.8
                units: s    
            fom_pitch: not_defined
            fom_roll:  not_defined
            fom_yaw:   not_defined
            fom_sum:   not_defined 

        couplet:
            transmitters: [passive]
            receivers: [scalar_magnetometer]
            description: Passive Earth-field transmitter paired with single scalar magnetometer receiver mounted in the RESOLVE EM bird.  

        base_magnetometer:
            label: base_magnetometer
            description: Ground magnetic base stations were set-up to measure the total intensity of the earth's magnetic field. The base stations were placed in a magnetically quiet area, away from power lines and moving metallic objects. The contracted specification for the collected ground magnetic data was the non-linear variations in the magnetic data were not to exceed 5 nT per 5 minute period. Pulsations having periods of 5 minutes or less shall not exceed 2 nT, pulsations having periods between 5 and 10 minutes shall not exceed 4 nT, and pulsations having periods between 10 and 20 minutes shall not exceed 8 nT.
            sensor_type: CGG CF1 using Scintrex cesium vapour sensor with Marconi GPS card and antenna for measurement synchronization to GPS
            sample_frequency:
                values: 1
                units: s  
            secondary_sensor_model: GEM GSM-19
            secondary_sensor_sample_frequency: 0.33 per sec
            secondary_sensor_accuracy: 0.2 nT
            secondary_sensor_precision: 0.01 nT  
            location_names: Greenwood, MS
            setup_dates: 2018-02-20 to 2018-03-05
            latitude:
                values: "33 29 50.6815N"
                units: degrees minutes seconds
            longitude:
                values: "90 04 44.7918 W"
                units: degrees minutes seconds
            ellipsoidal_height:
                values: 20.643
                units: m

        dynamic_compensation: Heading test performed with passes in magnetic N,S,E,W; heading errors within acceptable limits (e.g., N-S ~0.2-0.8 nT; E-W up to ~0.5-1.0 nT), indicating low aircraft-induced magnetic noise.  
        diurnal_correction: Diurnal variation extracted from base station records (1 Hz), filtered (51 s median + 51 s Hanning), interpolated to 10 Hz, and applied to airborne TMF; a local regional field value of 49,405 nT (from first day's average) was removed prior to RMI calculation. 
        microlevelling: Microlevelling applied after tie-line levelling
        lag_correction: Lag of 1.8 s applied to TMF based on lag test 
        igrf_model_location: "Greenwood, Mississippi (survey area)" 
        igrf_model_date: "2018-11-15/2019-02-18"  
        igrf_model_height: sensor altitude 42 m above ground level
        igrf_removed_model_epoch: "2015.0"
        tieline_levelling: Magnetic data were levelled using tie/traverse intercepts, manual adjustments where needed, and microlevelling applied to produce final RMI/TMI products.  
        altitude_correction: none
        deliverables: Total Magnetic Intensity (TMI), Residual Magnetic Intensity (RMI), and Calculated Vertical Magnetic Gradient (CVG), provided with ancillary EM & terrain data.

        
radiometric_system:
    type: system
    mode: airborne
    method: gamma spectrometry
    instrument: Radiation Solutions RS-500 gamma-ray spectrometer  

    dimensions:
        spec_sample:
            standard_name: spec_sample
            long_name: radiometric sample
            units: not_defined
            missing_value: not_defined
            length: 256
            increment: 1
            origin: 0
            discrete: True

    variables:

        transmitter:
            label: passive
            description: No artificial radiation source was used; the system measures naturally occurring gamma radiation from potassium-40, uranium and thorium decay series, and total count.  

        receiver:
            label: gamma_spectrometer
            sensor_type: NaI(Tl) scintillation crystals
            sensor_model: RS-500
            sensor_manufacturer: Radiation Solutions Inc.
            description: Airborne gamma-ray spectrometer consisting of one downward-looking NaI(Tl) detector pack (16.8 liters) and one upward-looking detector (4.2 liters), mounted in the helicopter cabin. Measures total count, potassium, uranium, thorium, and upward-uranium windows. Includes embedded live-time electronics for dead-time correction. 
            crystal_type: NaI(Tl) 
            operating_range:
                values: "0 to 100000"
                units: counts_per_second  
            operating_limits:
                values: "-20 to +50"  
                units: temperature, degrees Celsius
            sample_frequency:
                values: 1.0
                units: Hz 
            downward_volume:
                values: 16.8
                units: liters 
            upward_volume:
                values: 4.2
                units: liters  
            spectrometer_TC_win: not_defined     
            spectrometer_K_win: not_defined      
            spectrometer_Th_win: not_defined     
            spectrometer_U_win: not_defined      
            spectrometer_cosmic_win: not_defined
            K_index_start: not_defined
            K_index_end: not_defined
            Th_index_start: not_defined
            Th_index_end: not_defined
            U_index_start: not_defined
            U_index_end: not_defined
            TC_index_start: not_defined
            TC_index_end: not_defined
            cosmic_index_start: not_defined
            cosmic_index_end: not_defined
            UU_index_start: not_defined
            UU_index_end: not_defined

        couplet:
            transmitters: [passive]
            receivers: [gamma_spectrometer]
            description: Passive gamma-ray field paired with dual-detector RS-500 spectrometer for downward and upward radiation measurements.
        
        down_livetime_or_deadtime_corrected: livetime
        up_livetime_or_deadtime_corrected:   livetime
        lowpass_filtering: Hanning smoothing; cosmic=9-pt, radar/temp/pressure=3-pt; upward-U=51-pt (radon processing)
        lowpass_filtering_fid_cutoff_cosmic: 9

        lowpass_filtering_fid_cutoff_TC: not_defined      
        lowpass_filtering_fid_cutoff_K:  not_defined      
        lowpass_filtering_fid_cutoff_Th: not_defined      
        lowpass_filtering_fid_cutoff_U:  not_defined      
        lowpass_filtering_fid_cutoff_altimeter: 3 

        background_parameter_aircraft_TC: 19.43
        background_parameter_aircraft_K:  2.61
        background_parameter_aircraft_Th: -0.48
        background_parameter_aircraft_U:  -1.94
        background_parameter_aircraft_UU: 0.50        

        background_parameter_cosmic_TC: 1.2442
        background_parameter_cosmic_K:  0.0744
        background_parameter_cosmic_Th: 0.0656
        background_parameter_cosmic_U:  0.0528
        background_parameter_cosmic_UU: 0.0140       

        radon_background_correction_method: "Upward Detector Method (hover site calibration)"
        radon_background_correction_up_method_A1: not_defined 
        radon_background_correction_up_method_A2: not_defined           

        compton_stripping_ratio_alpha: 0.2820
        compton_stripping_ratio_beta:  0.4090
        compton_stripping_ratio_gamma: 0.7680
        compton_stripping_ratio_a:     0.0460   
        compton_stripping_ratio_b:     0.0040   
        compton_stripping_ratio_g:     0.0070   
        compton_stripping_nominal_altitude: 
            values: 60
            units: m  

        height_attenuation_coefficient_TC: -0.008250
        height_attenuation_coefficient_K:  -0.012530
        height_attenuation_coefficient_U:  -0.004400
        height_attenuation_coefficient_Th: -0.007170  

        source_sensitivity_factor_TC: not_defined        
        source_sensitivity_factor_K:  81.1              
        source_sensitivity_factor_Th: 4.9               
        source_sensitivity_factor_U:  8.0 

        air_absorbed_dose_rate: 25.42
        natural_dose_rate_components: "13.07, 5.675, 2.494"

        corrections: Radiometric corrections include cosmic and aircraft background stripping, radon-background removal, altitude attenuation correction to 60 m nominal, Compton stripping, and conversion to ground concentrations. Live time measured electronically (in ms) and applied to correct all radiometric windows (TC, K, U, Th, UpU) to true count rates using the relationship C_lt = (1000 * C_raw) / L.
        calibration_pads: Stripping ratios and coefficients determined by Radiation Solutions using RS-500 calibration pads prior to survey start. 
        cosmic_calibration: High-altitude passes (7,500-10,000 ft AGL at 500 ft intervals) collected to determine cosmic and aircraft background coefficients. 
        height_attenuation: Calibration lines flown at 30-150 m above ground on a repeat test line used to determine attenuation coefficients for each window.  
        radon_correction: Upward-looking detector smoothed (51-pt Hanning) to derive radon component; radon stripped from downward uranium then propagated to other windows.  
        prefiltering: Radar altimeter, pressure, temperature smoothed with 3-pt Hanning; cosmic channel smoothed with 9-pt Hanning before corrections applied.  
        compton_stripping: Height-corrected Compton coefficients (alpha, beta, gamma) applied for inter-window spectral overlap using altitude-dependent adjustments.  
        altitude_attenuation_correction: "nominal_height 60 m"
        conversion_to_concentrations: Corrected K, U, Th windows converted to apparent concentrations using system sensitivities (S-factors), and dose rate computed from K, eU, eTh using reported coefficients.  
        radiometric_ratios: Ratios (eU/eTh, eU/K, eTh/K) calculated following IAEA TR-323 guidelines, using summed neighborhood windows to stabilize low-count data. 
        deliverables: Total Count, Potassium (%K), Equivalent Uranium (eU ppm), Equivalent Thorium (eTh ppm), Air Absorbed Dose Rate (nGy/h), upward-looking spectrum, downward-looking spectrum, and derived radiometric ratios.  

dimensions:
    layer_depth:
        standard_name: layer_depth
        long_name: layer depth below surface
        units: meters
        missing_value: not_defined
        length: 31
        increment: 5.0
        origin: 2.5
        axis: Z
        positive: down
        datum: ground surface
