dataset_attrs:
    content: raw loupe EM data
    comment: n/a
    type: data,
    mode: ground
    method: electromagnetic, time domain
    instrument: LoupeEM

coordinates:
    x: EAST
    y: NORTH
    z: HEIGHT

loupe_system:
    type: system
    mode: ground
    method: electromagnetic, time domain
    instrument: LoupeEM
    data_normalized: True
    reference_frame: right-handed positive down
    sample_rate: 0.1
    digitization_frequency: 504000.0
    stacks: 360
    powerline_frequency: 60.0

    dimensions:
        gate_times:
            standard_name: gate_times
            long_name: receiver gate times
            units: seconds
            null_value: not_defined
            bounds: [[1.098e-05, 1.495e-05], [1.297e-05, 1.694e-05], [1.495e-05, 1.892e-05], [1.694e-05, 2.09e-05], [1.892e-05, 2.289e-05], [2.09e-05, 2.884e-05], [2.686e-05, 3.479e-05], [3.281e-05, 4.471e-05], [4.075e-05, 5.662e-05], [5.265e-05, 7.249e-05], [6.654e-05, 9.035e-05], [8.638e-05, 0.00011813], [0.00011217, 0.00015583], [0.0001459, 0.00020146], [0.00019154, 0.00026694], [0.00025305, 0.00035225], [0.00033241, 0.00046733], [0.00043956, 0.0006221], [0.00058241, 0.00082249], [0.00077289, 0.00109233], [0.00102487, 0.00144948], [0.00136019, 0.00192567], [0.0018086, 0.00255662]]
            centers: [1.2965e-05, 1.4955e-05, 1.6935e-05, 1.892e-05, 2.0905e-05, 2.487e-05, 3.0825e-05, 3.876e-05, 4.8685e-05, 6.257e-05, 7.8445e-05, 0.00010226, 0.000134, 0.00017368, 0.00022924, 0.00030265, 0.00039987, 0.00053083, 0.00070245, 0.00093261, 0.0012372, 0.0016429, 0.0021826]

        n_loop_vertices:
            standard_name: number_of_loop_vertices
            long_name: number of loop vertices
            units: not_defined
            null_value: not_defined
            length: 8

        xyz:
            standard_name: xyz_coordinates
            long_name: coordinates of the loop vertices
            units: not_defined
            null_value: not_defined
            length: 3

    variables:
        transmitter:
            label: z
            number_of_turns: 13
            coordinates:
                values: [[[0.33, 0.14, 0.0], [0.14, 0.33, 0.0], [-0.14, 0.33, 0.0], [-0.33, 0.14, 0.0], [-0.33, -0.14, 0.0], [-0.14, -0.33, 0.0], [0.14, -0.33, 0.0], [0.33, -0.14, 0.0]]]
                dimensions: ['n_transmitter', 'n_loop_vertices', 'xyz']
            area: 0.358
            waveform_type: trapezoid
            waveform_time:
                values: [-0.00277778, -0.00276878, 0.0, 9e-06]
                long_name: waveform time
                null_value: not_defined
                units: s
            waveform_current:
                values: [0.0, 1.0, 1.0, 0.0]
                dimensions: ['waveform_time']
            current_scale_factor: 1.0
            peak_current: 20.0
            moment: 94.42
            base_frequency: 90.0
            on_time: 0.00276878
            off_time: 0.00278678
            orientation: z
            height: 1.0

        receiver:
            label: ['x', 'y', 'z']
            orientation: ['x', 'y', 'z']
            coil_low_pass_filter: [100000.0, 100000.0, 100000.0]
            instrument_low_pass_filter: [250000.0, 250000.0, 250000.0]
            area: [200.0, 200.0, 200.0]
            delay_time: [4.58e-06, 4.58e-06, 4.58e-06]
            height: [1.75, 1.75, 1.75]
            gain: [10, 10, 10]

        couplet:
            transmitters: ['z', 'z', 'z']
            receivers: ['x', 'y', 'z']
            sample_rate: [1.0, 1.0, 1.0]
            txrx_dx: [-10.0, -10.0, -10.0]
            txrx_dy: [0.0, 0.0, 0.0]
            txrx_dz: [-0.75, -0.75, -0.75]
            data_type: ['dBdt', 'dBdt', 'dBdt']
            gate_times: ['gate_times', 'gate_times', 'gate_times']

        sample_rate:
            units: s
        transmitter_area:
            units: m^2

variables:
    X_CH:
        standard_name: x_ch
        long_name: X time channel windows data
        null_value: not_defined
        units: nV/Am4
        dimensions: ['index', 'gate_times']
        system_couplet: z_x
    Y_CH:
        standard_name: y_ch
        long_name: Y time channel windows data
        null_value: not_defined
        units: nV/Am4
        dimensions: ['index', 'gate_times']
        system_couplet: z_y
    Z_CH:
        standard_name: z_ch
        long_name: Z time channel windows data
        null_value: not_defined
        units: nV/Am4
        dimensions: ['index', 'gate_times']
        system_couplet: z_z
    HEIGHT:
        standard_name: height
        long_name: Calculated reading position height above MSL, WGS84 ellipsoid
        null_value: not_defined
        units: meter
        positive: up
        datum: WGS84 ellipsoid
